approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: pnpm

npmAuditRegistry: "https://registry.npmjs.org"

npmMinimalAgeGate: 0

# A dependency on one of this workspace's own package names resolves to the published
# package unless it is written with `workspace:`. With this on, `@d0paminedriven/fs`,
# which the tests use and which depends on the published `mimedown` and `pdfdown`, was
# linked to `crates/mimedown-node` and `crates/pdfdown-node` instead, which hold no built
# addon in CI. Leaving the line out is not off: yarn's default is true.
enableTransparentWorkspaces: false

supportedArchitectures:
  cpu:
    - current
    - wasm32

catalogs:
  az:
    "@azure-rest/ai-document-intelligence": ^1.1.0
  chalk:
    chalk: ^6.0.1
  dd:
    "@d0paminedriven/fs": ^12.8.0
    "@d0paminedriven/type-utils": ^1.3.0
  dotenv:
    dotenv: ^18.0.10
  emnapi:
    "@emnapi/core": ^2.0.0-beta.3
    "@emnapi/runtime": ^2.0.0-beta.3
    emnapi: ^2.0.0-beta.3
  husky:
    husky: ^9.1.7
  lint:
    lint-staged: ^17.6.2
  mssql:
    mssql: ^12.8.1
    "@types/mssql": ^12.3.1
  napi:
    "@napi-rs/cli": ^3.11.1
    "@napi-rs/wasm-runtime": ^1.2.7
  node:
    "@types/node": ^26.6.11
  ox:
    oxfmt: ^0.80.0
    oxlint: ^1.95.0
  oxc:
    "@oxc-node/core-wasm32-wasi": ^1.0.3
    "@oxc-node/core": ^1.0.3
  pw:
    playwright-core: ^1.65.1
  rolldown:
    rolldown: ^1.3.4
    rolldown-plugin-wasm: ^0.3.2
  run-all:
    npm-run-all2: ^9.1.0
  taplo:
    "@taplo/cli": ^0.7.0
  tiny:
    tinybench: ^6.2.5
  ts:
    tslib: ^2.9.1
    typescript: ^7.1.0-beta
  tsdown:
    tsdown: ^0.23.7
  tsx:
    tsx: ^4.23.15
  tybys:
    "@tybys/wasm-util": ^0.10.5
