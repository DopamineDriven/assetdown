[workspace]
members = [
  "crates/audiodown",
  "crates/audiodown-node",
  "crates/contentdown",
  "crates/docxdown",
  "crates/docxdown-node",
  "crates/mimedown",
  "crates/mimedown-node",
  "crates/ocrdown",
  "crates/ooxmldown",
  "crates/pdfdown",
  "crates/pdfdown-meta",
  "crates/pdfdown-ocr",
  "crates/pdfdown-node",
  "crates/pptxdown",
  "crates/pptxdown-node",
  "crates/tiffdown",
  "crates/tiffdown-node",
  "crates/videodown",
  "crates/videodown-node",
  "crates/xlsxdown",
  "crates/xlsxdown-node"
]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/DopamineDriven/assetdown"
rust-version = "1.99.1"

[workspace.dependencies]
encoding_rs = "0.8.44"
flate2 = "1.1.11"
hayro-ccitt = "0.5.0"
hayro-jbig2 = { version = "0.4.0" }
hayro-jpeg2000 = { version = "0.5.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp"
] }
lopdf = "0.47.0"
mp4parse = "0.17.0"
napi = { version = "3.16.2", features = ["napi10"] }
napi-build = "2.6.0"
napi-derive = "3.7.1"
pdfium-render = { version = "0.9.5", default-features = false, features = [
  "pdfium_latest",
  "image_025",
  "thread_safe"
] }
rayon = "1.12.0"
roxmltree = "0.21.2"
rust_h264 = "=0.6.1"
rust_h265 = "=0.4.1"
symphonia = { version = "0.6.1", default-features = false, features = [
  "pcm",
  "adpcm",
  "opt-simd"
] }
symphonia-opus = "=0.1.2"
tesseract-rs = { version = "0.4.0", default-features = false, features = [
  "use-system-tesseract"
] }
thiserror = { version = "2.0.21" }
weezl = "0.2.1"
zip = { version = "9.5.1", default-features = false, features = [
  "deflate-flate2-zlib-rs"
] }

audiodown      = { path = "crates/audiodown" }
audiodown-node = { path = "crates/audiodown-node" }
contentdown    = { path = "crates/contentdown" }
docxdown       = { path = "crates/docxdown" }
docxdown-node  = { path = "crates/docxdown-node" }
mimedown       = { path = "crates/mimedown" }
mimedown-node  = { path = "crates/mimedown-node" }
ocrdown        = { path = "crates/ocrdown" }
ooxmldown      = { path = "crates/ooxmldown" }
pdfdown        = { path = "crates/pdfdown" }
pdfdown-meta   = { path = "crates/pdfdown-meta" }
pdfdown-node   = { path = "crates/pdfdown-node" }
pdfdown-ocr    = { path = "crates/pdfdown-ocr" }
pptxdown       = { path = "crates/pptxdown" }
pptxdown-node  = { path = "crates/pptxdown-node" }
tiffdown       = { path = "crates/tiffdown" }
tiffdown-node  = { path = "crates/tiffdown-node" }
videodown      = { path = "crates/videodown" }
videodown-node = { path = "crates/videodown-node" }
xlsxdown       = { path = "crates/xlsxdown" }
xlsxdown-node  = { path = "crates/xlsxdown-node" }

[profile.release]
lto   = true
strip = "symbols"
