[package]
description            = "rust-powered mp3/wav metadata, pcm decoding, and waveform peaks for node"
edition.workspace      = true
license.workspace      = true
name                   = "audiodown-node"
repository.workspace   = true
rust-version.workspace = true
version                = "0.2.0"
[dependencies]
audiodown.workspace   = true
napi                  = { workspace = true, features = ["tokio_rt"] }
napi-derive.workspace = true
[lib]
crate-type = ["cdylib"]
[build-dependencies]
napi-build.workspace = true
