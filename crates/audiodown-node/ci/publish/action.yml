name: Publish audiodown-node
description: >-
  Assemble the per-platform packages from this run's builds, then publish them
  with the main package, when the commit is a release. Any other commit stops once the packages are assembled:
  nothing is sent to npm, not even as a dry run, which npm refuses for a version that is
  already published.

inputs:
  release-name:
    description: >-
      What a release commit's subject starts with. A commit whose subject is
      exactly `<release-name>@<package.json version>` is a release.
    required: true
  allow-release:
    description: Whether this run may publish at all. Anything but `true` publishes nothing.
    default: "false"
  npm-token:
    description: The npm token. Only a real publish needs it.
    default: ""

runs:
  using: composite
  steps:
    - name: Create npm dirs
      shell: bash
      run: yarn workspace @d0paminedriven/audiodown napi create-npm-dirs
    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: bindings-*
        path: crates/audiodown-node/artifacts
    - name: Take the loader this run generated
      shell: bash
      working-directory: crates/audiodown-node
      # The main package ships index.js, index.d.ts and browser.js. Every build regenerates
      # them, so the published ones come from this run and not from an earlier commit.
      run: |
        for file in index.js index.d.ts browser.js; do
          found="$(find artifacts -name "$file" -print -quit)"
          if [ -n "$found" ]; then cp "$found" "$file"; fi
        done
    - name: Move artifacts
      shell: bash
      run: yarn workspace @d0paminedriven/audiodown artifacts
    - name: List packages
      shell: bash
      working-directory: crates/audiodown-node
      run: ls -R ./npm
    - name: Decide whether this is a release
      id: release
      shell: bash
      working-directory: crates/audiodown-node
      env:
        RELEASE_NAME: ${{ inputs.release-name }}
        ALLOW_RELEASE: ${{ inputs.allow-release }}
      run: |
        version="$(node -p "require('./package.json').version")"
        subject="$(git log -1 --pretty=%s)"
        mode=skip
        if [ "$ALLOW_RELEASE" = "true" ]; then
          if [ "$subject" = "$RELEASE_NAME@$version" ]; then
            mode=release
          elif printf '%s' "$subject" | grep -q "^$RELEASE_NAME@[0-9]"; then
            echo "::error::The commit is \"$subject\" but package.json is at $version; nothing was published."
            exit 1
          fi
        fi
        # A version with a prerelease part goes out under `next`, not `latest`.
        tag=latest
        case "$version" in *-*) tag=next ;; esac
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "$RELEASE_NAME $version: $mode (dist-tag $tag), from commit \"$subject\""
    - name: Publish
      if: ${{ steps.release.outputs.mode == 'release' }}
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
        # yarn takes its token from here; npm takes its own from ~/.npmrc, written below.
        YARN_NPM_AUTH_TOKEN: ${{ inputs.npm-token }}
        TAG: ${{ steps.release.outputs.tag }}
        # Read by every `npm publish` that `napi pre-publish` runs for the per-platform
        # packages.
        npm_config_tag: ${{ steps.release.outputs.tag }}
        npm_config_access: public
        # Provenance, for every `npm publish` here. It is set in the environment and not with
        # `npm config set`, which npm refuses inside a member of a workspace ("This command
        # does not support workspaces").
        npm_config_provenance: "true"
      run: |
        if [ -z "$NPM_TOKEN" ]; then
          echo "::error::This is a release commit but no npm token was provided."
          exit 1
        fi
        echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
        # Publishes the per-platform packages and writes them into optionalDependencies.
        # No GitHub release: its tag would be a bare `v<version>`, which several packages
        # in one repository would fight over.
        yarn workspace @d0paminedriven/audiodown napi pre-publish -t npm --no-gh-release
        # The package itself goes out through yarn, whose workspace this is: where the
        # manifest says `catalog:`, yarn sends the version the catalog names. A version that
        # is already on npm (a release commit pushed again) is left alone.
        yarn workspace @d0paminedriven/audiodown npm publish --access public --tag "$TAG" --provenance --tolerate-republish
