[package]
description            = "Convenient mime sniffing for Node"
edition.workspace      = true
keywords               = ["mime", "detect", "identify", "sniff", "node-bindings", "rust"]
license                = { workspace = true }
name                   = "mimedown-node"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version                = "0.5.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
mimedown              = { workspace = true, features = ["pdf", "office", "audio", "video"] }
napi.workspace        = true
napi-derive.workspace = true

[build-dependencies]
napi-build.workspace = true
