[package]
description            = "Node bindinigs for pdfdown and its superset, pdfdown-ocr"
edition.workspace      = true
license.workspace      = true
name                   = "pdfdown-node"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version                = "0.18.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
contentdown.workspace  = true
napi.workspace         = true
napi-derive.workspace  = true
pdfdown.workspace      = true
pdfdown-meta.workspace = true
pdfdown-ocr            = { workspace = true, optional = true }

[features]
ocr    = ["dep:pdfdown-ocr"]
render = ["pdfdown/render", "pdfdown-ocr?/render"]

[build-dependencies]
napi-build.workspace = true
