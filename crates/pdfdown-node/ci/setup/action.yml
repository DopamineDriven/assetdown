name: Set up pdfdown-node
description: >-
  Yarn 4 through Corepack, Node, and the workspace's dependencies, installed once at the
  repository root.

inputs:
  node-version:
    description: Node.js version to install.
    default: "26"
  architecture:
    description: Node.js architecture; empty for the runner's own.
    default: ""
  cpu:
    description: >-
      JSON array for yarn's supportedArchitectures.cpu, for a job that runs the
      tests on another architecture. Empty keeps what .yarnrc.yml says.
    default: ""
  libc:
    description: >-
      JSON array for yarn's supportedArchitectures.libc, for a job that runs the
      tests in a musl container. Empty keeps what .yarnrc.yml says.
    default: ""

runs:
  using: composite
  steps:
    # Runners ship Yarn 1.x globally, which refuses a packageManager of yarn@4. Enable
    # Corepack before setup-node so its `cache: yarn` probe already resolves Yarn 4.
    - name: Enable Corepack
      shell: bash
      # This runs on the Node the runner image comes with, before setup-node installs the
      # one asked for. Shims go to a fresh directory prepended to PATH: on Windows the
      # preinstalled Yarn 1 shares the npm prefix, as does the corepack.cmd of a Node that
      # still ships one (24 and older; 25 and later do not), and both collide with
      # `npm i -g` and `corepack enable` writing into it. `--force` is for that older Node:
      # it lets npm write over shims already there, and does nothing where there are none.
      run: |
        npm i -g corepack --force
        mkdir -p "$RUNNER_TEMP/corepack-bin"
        corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
        echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
    # Yarn links every installed file from an index it keeps in its global folder, and a hard
    # link cannot cross drives. A Windows runner has the home folder on C: and the checkout
    # on D:, and the install stopped there ("EXDEV: cross-device link not permitted"). So the
    # global folder, and the cache inside it, is put beside the checkout on every runner.
    # This comes before setup-node, which asks yarn where its cache is.
    - name: Keep yarn's global folder on the checkout's drive
      shell: bash
      run: echo "YARN_GLOBAL_FOLDER=$RUNNER_TEMP/yarn-global" >> "$GITHUB_ENV"
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        architecture: ${{ inputs.architecture }}
        cache: yarn
        # The yarn project is the repository root: one lockfile serves every package.
        cache-dependency-path: yarn.lock
    - name: Widen the architectures yarn installs for
      if: ${{ inputs.cpu != '' || inputs.libc != '' }}
      shell: bash
      env:
        CPU: ${{ inputs.cpu }}
        LIBC: ${{ inputs.libc }}
      run: |
        if [ -n "$CPU" ]; then yarn config set --json supportedArchitectures.cpu "$CPU"; fi
        if [ -n "$LIBC" ]; then yarn config set --json supportedArchitectures.libc "$LIBC"; fi
    - name: Install dependencies
      shell: bash
      # At the repository root, where the lockfile is. Every yarn command after this is run
      # from there too, as `yarn workspace <package> <command>`.
      run: yarn install
