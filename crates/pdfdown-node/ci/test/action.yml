name: Test pdfdown-node
description: Download one target's build and run the test suite against it.

inputs:
  target:
    description: The Rust target triple whose artifact is tested.
    required: true
  mode:
    description: >-
      Where the tests run: `host` on this runner, `docker` in a Node container
      on this runner, or `wasi` on this runner against the WebAssembly build.
    required: true
  image:
    description: The Node container image, for `docker`.
    default: ""
  platform:
    description: The container platform, for `docker`.
    default: ""
  typecheck:
    description: Also typecheck the tests against the generated declarations.
    default: "false"

runs:
  using: composite
  steps:
    - name: Download artifact
      id: download
      uses: actions/download-artifact@v7
      # The first download has been seen to fail on some hosted runners; one retry follows.
      continue-on-error: true
      with:
        name: bindings-${{ inputs.target }}
        path: crates/pdfdown-node
    - name: Retry download artifact
      if: ${{ steps.download.outcome == 'failure' }}
      uses: actions/download-artifact@v7
      with:
        name: bindings-${{ inputs.target }}
        path: crates/pdfdown-node
    - name: List package files
      shell: bash
      working-directory: crates/pdfdown-node
      run: ls -la
    - name: Typecheck the tests
      if: ${{ inputs.typecheck == 'true' }}
      shell: bash
      run: yarn workspace @d0paminedriven/pdfdown tsc --noEmit -p __test__
    - name: Test on the runner
      if: ${{ inputs.mode == 'host' }}
      shell: bash
      run: yarn workspace @d0paminedriven/pdfdown test
    - name: Test in a container
      if: ${{ inputs.mode == 'docker' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PLATFORM: ${{ inputs.platform }}
      # The container has Node but not Yarn 4, so it runs tsx by its own file and not through
      # the package's `test` script. The file is named, and not `node_modules/.bin/tsx`: the
      # install links each package to what it declares and keeps no `.bin` beside it.
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          -w "$GITHUB_WORKSPACE/crates/pdfdown-node" \
          --platform "$PLATFORM" \
          "$IMAGE" \
          sh -lc 'node node_modules/tsx/dist/cli.mjs --test "__test__/**/*.spec.ts"'
    - name: Test the WebAssembly build
      if: ${{ inputs.mode == 'wasi' }}
      shell: bash
      run: yarn workspace @d0paminedriven/pdfdown test:wasi
