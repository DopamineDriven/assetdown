[package]
description = "convenient pdf/ocr helpers; a superset of pdfdown"
edition.workspace = true
keywords = [
  "pdf",
  "extraction",
  "metadata",
  "images",
  "annots",
  "ocr",
  "rendering"
]
license = { workspace = true }
name = "pdfdown-ocr"
repository.workspace = true
version = "0.18.0"
[dependencies]
contentdown.workspace  = true
image.workspace        = true
lopdf.workspace        = true
ocrdown.workspace      = true
pdfdown.workspace      = true
pdfdown-meta.workspace = true
rayon.workspace        = true

[features]
render = ["pdfdown/render"]
